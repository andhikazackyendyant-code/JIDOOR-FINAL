    <link

    <link

        href="assets/css/detail-pesanan.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/uniform.css">
<link rel="stylesheet" href="assets/css/mobile-responsive.css">
</head>

<body>

<div class="page-wrapper">

    <div class="navbar">

        <div class="nav-container">

            <a
                href="index.html"
                class="logo">

                <img
                    src="assets/img/JIDOOR LOGO.png"
                    alt="Jidoor Konveksi">

            </a>

            <div class="menu">

    <a href="index.html" class="nav-link">
        Beranda
    </a>

    <a href="lihat-produk.html" class="nav-link">
        Produk
    </a>

    <a href="keranjang.html" class="nav-link">
        Keranjang
        <span id="cartBadge" class="cart-badge">0</span>
    </a>

    <a href="kontak.html" class="nav-link">
        Kontak
    </a>

</div>

<div class="nav-right">

    <div class="search-box">

        <input
            type="text"
            placeholder="Cari produk...">

        <i class="bi bi-search"></i>

    </div>

    <div id="authArea">

        <a
            href="login.html"
            class="btn-login">

            Masuk

        </a>

    </div>

 </div>
</div>
</div>

    <main class="detail-page">

        <div class="detail-header">

            <span class="detail-label">
                PESANAN
            </span>

            <h1>
                Detail Pesanan
            </h1>

            <p>
                Informasi lengkap mengenai pesanan Anda.
            </p>

        </div>

        <div
            id="detailContent"
            class="detail-content">

        </div>

    </main>

    <footer>

        © 2026 Jidoor Konveksi

    </footer>

    <script src="assets/js/auth.js"></script>
<script src="assets/js/media-sync.js"></script>

    <script>
    const container =
        document.getElementById("detailContent");

    function parseHarga(value) {

        if (typeof value === "number") {
            return value;
        }

        return parseInt(
            String(value || "")
                .replace(/[^0-9]/g, ""),
            10
        ) || 0;
    }

    function rupiah(nilai) {
        return "Rp " +
            parseHarga(nilai)
                .toLocaleString("id-ID");
    }

    function getVariants(item) {

        if (
            Array.isArray(item.variants) &&
            item.variants.length
        ) {
            return item.variants;
        }

        return [{
            ukuran: item.ukuran || "-",
            lengan: item.lengan || "-",
            jumlah:
                Number(
                    item.jumlah ||
                    item.qty ||
                    item.quantity ||
                    1
                )
        }];
    }

    function renderVariants(item) {

        return getVariants(item)
            .map(function (variant) {
                return `
                    <span>
                        ${variant.ukuran || "-"}
                        · ${variant.lengan || "-"}
                        × ${Number(variant.jumlah) || 0}
                    </span>
                `;
            })
            .join("");
    }

    function getStatusClass(status) {

        const text =
            String(status || "").toLowerCase();

        if (
            text.includes("berhasil") ||
            text.includes("selesai")
        ) {
            return "status-success";
        }

        if (
            text.includes("belum") ||
            text.includes("menunggu")
        ) {
            return "status-pending";
        }

        return "status-process";
    }

    const riwayat =
        JSON.parse(
            localStorage.getItem("riwayatPesanan")
        ) || [];

    const pesananTerakhir =
        JSON.parse(
            localStorage.getItem("pesananTerakhir")
        );

    const params =
        new URLSearchParams(
            window.location.search
        );

    const idPesanan =
        params.get("id");

    const pesanan =
        idPesanan
            ? riwayat.find(
                item =>
                    String(item.id) ===
                    String(idPesanan)
            ) ||
            (
                pesananTerakhir &&
                String(pesananTerakhir.id) ===
                String(idPesanan)
                    ? pesananTerakhir
                    : null
            )
            : pesananTerakhir;

    if (!pesanan) {

        container.innerHTML = `

            <div class="detail-empty">

                <div class="detail-empty-icon">
                    <i class="bi bi-receipt"></i>
                </div>

                <h2>
                    Pesanan Tidak Ditemukan
                </h2>

                <p>
                    Data pesanan belum tersedia.
                </p>

                <a
                    href="riwayat.html"
                    class="detail-primary-button">

                    Lihat Riwayat Pesanan

                </a>

            </div>

        `;

    } else {

        let items =
            pesanan.items ||
            pesanan.produk ||
            pesanan.products ||
            [];

        if (
            !Array.isArray(items) &&
            typeof items === "object"
        ) {
            items = [items];
        }

        let productHTML = "";

        if (items.length > 0) {

            productHTML =
                items.map(
                    item => {

                        const nama =
                            item.nama ||
                            item.name ||
                            item.produk ||
                            "Produk";

                        const jumlah =
                            Number(
                                item.jumlah ||
                                item.qty ||
                                item.quantity ||
                                1
                            );

                        let subtotal =
                            parseHarga(
                                item.subtotal
                            ) ||
                            parseHarga(
                                item.total
                            ) ||
                            parseHarga(
                                item.totalHarga
                            ) ||
                            parseHarga(
                                item.priceTotal
                            );

                        if (!subtotal) {

                            subtotal =
                                parseHarga(
                                    item.harga ??
                                    item.price ??
                                    item.nominal ??
                                    item.unitPrice
                                ) *
                                jumlah;
                        }

                        if (
                            subtotal === 0 &&
                            items.length === 1
                        ) {
                            subtotal =
                                parseHarga(
                                    pesanan.subtotal
                                );
                        }

                        const gambar =
                            item.gambar ||
                            item.image ||
                            item.img ||
                            "assets/img/placeholder.jpg";

                        return `

                            <div class="detail-product">

                                <img
                                    src="${gambar}"
                                    alt="${nama}"
                                    onerror="this.style.display='none';">

                                <div class="detail-product-info">

                                    <h3>
                                        ${nama}
                                    </h3>

                                    <div class="order-variant-list">
                                        ${renderVariants(item)}
                                    </div>

                                    <p>
                                        Total ${jumlah} pcs
                                    </p>

                                </div>

                                <div class="detail-product-price">

                                    ${rupiah(subtotal)}

                                </div>

                            </div>

                        `;
                    }
                ).join("");

        } else {

            productHTML = `

                <div class="detail-product-empty">

                    Informasi produk tidak tersedia.

                </div>

            `;
        }

        container.innerHTML = `

            <section class="detail-card">

                <div class="detail-card-header">

                    <div>

                        <span>
                            Nomor Pesanan
                        </span>

                        <strong>
                            #${pesanan.id || "-"}
                        </strong>

                    </div>

                    <div class="detail-status-group">

                        <span class="detail-status-label">
                            Status Pesanan
                        </span>

                        <span
                            class="detail-status ${getStatusClass(
                                pesanan.statusPesanan
                            )}">

                            ${
                                pesanan.statusPesanan ||
                                "Diproses"
                            }

                        </span>

                    </div>

                </div>

                <div class="detail-divider"></div>

                <div class="detail-info-grid">

                    <div class="detail-info-item">

                        <span>
                            Metode Pembayaran
                        </span>

                        <strong>
                            ${
                                pesanan.metodePembayaran ||
                                "-"
                            }
                        </strong>

                    </div>

                    <div class="detail-info-item">

                        <span>
                            Status Pembayaran
                        </span>

                        <strong>

                            ${
                                pesanan.statusPembayaran ||
                                "Belum Dibayar"
                            }

                        </strong>

                    </div>

                    <div class="detail-info-item">

                        <span>
                            Tanggal Pesanan
                        </span>

                        <strong>

                            ${
                                pesanan.tanggal ||
                                pesanan.createdAt ||
                                "-"
                            }

                        </strong>

                    </div>

                </div>

            </section>

            <section class="detail-card">

                <h2>
                    Informasi Pelanggan
                </h2>

                <div class="customer-grid">

                    <div class="customer-item">

                        <span>
                            Nama
                        </span>

                        <strong>
                            ${
                                pesanan.nama ||
                                pesanan.namaPemesan ||
                                "-"
                            }
                        </strong>

                    </div>

                    <div class="customer-item">

                        <span>
                            No. HP
                        </span>

                        <strong>
                            ${
                                pesanan.noHp ||
                                pesanan.telepon ||
                                pesanan.phone ||
                                "-"
                            }
                        </strong>

                    </div>

                    <div class="customer-item customer-address">

                        <span>
                            Alamat
                        </span>

                        <strong>
                            ${
                                pesanan.alamat ||
                                "-"
                            }
                        </strong>

                    </div>

                </div>

            </section>

            <section class="detail-card">

                <h2>
                    Produk Pesanan
                </h2>

                <div class="detail-products">

                    ${productHTML}

                </div>

            </section>

            <section class="detail-card">

                <h2>
                    Ringkasan Pembayaran
                </h2>

                <div class="detail-summary">

                    <div>

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ${rupiah(pesanan.subtotal)}
                        </strong>

                    </div>

                    <div>

                        <span>
                            Ongkir
                        </span>

                        <strong>

                            ${
                                parseHarga(
                                    pesanan.ongkir
                                ) === 0
                                    ? "Gratis"
                                    : rupiah(
                                        pesanan.ongkir
                                    )
                            }

                        </strong>

                    </div>

                    <div class="detail-total">

                        <span>
                            Total
                        </span>

                        <strong>
                            ${rupiah(pesanan.total)}
                        </strong>

                    </div>

                </div>

            </section>

            <div class="detail-actions">

                <a
                    href="riwayat.html"
                    class="detail-secondary-button">

                    <i class="bi bi-arrow-left"></i>

                    Riwayat Pesanan

                </a>

                <a
                    href="index.html"
                    class="detail-primary-button">

                    Kembali ke Beranda

                </a>

            </div>

        `;
    }
</script>

</div>

</body>

</html>
