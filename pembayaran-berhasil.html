<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Pembayaran Berhasil | Jidoor Konveksi</title>

<link
    rel="stylesheet"
    href="assets/css/global.css">

<link
    rel="stylesheet"
    href="assets/css/navbar.css">

<link
    rel="stylesheet"
    href="assets/css/pembayaran-berhasil.css">

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/uniform.css">
<link rel="stylesheet" href="assets/css/mobile-responsive.css">
</head>

<body>

<div class="page-wrapper">

<div class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo">

            <img
                src="assets/img/JIDOOR LOGO.png"
                alt="Jidoor Konveksi">

        </a>

        <div class="menu">
    <a href="index.html" class="nav-link">Beranda</a>
    <a href="lihat-produk.html" class="nav-link">Produk</a>
    <a href="keranjang.html" class="nav-link">Keranjang
    <span id="cartBadge" class="cart-badge">0</span>
    </a>
    <a href="kontak.html" class="nav-link">Kontak</a>

        </div>

        <div class="nav-right">

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Cari produk...">

                <i class="bi bi-search"></i>

            </div>

            <div id="authArea">

                <a
                    href="login.html"
                    class="btn-login">

                    Masuk

                </a>

            </div>

        </div>

    </div>

</div>

<main class="success-page">

    <div class="success-card">

        <div class="success-icon">

            <i class="bi bi-check-lg"></i>

        </div>

        <span class="success-label">
            PESANAN BERHASIL
        </span>

        <h1>
            Pesanan Berhasil Dibuat!
        </h1>

        <p>
            Pesanan Anda telah tercatat.
            Bukti pembayaran akan diperiksa oleh admin
            sebelum pesanan diproses.
        </p>

        <div class="success-order">

            <span>
                Nomor Pesanan
            </span>

            <strong id="successOrderNumber">
                -
            </strong>

        </div>

        <div class="success-actions">

            <a
                href="detail-pesanan.html"
                class="success-primary">

                Lihat Detail Pesanan

                <i class="bi bi-arrow-right"></i>

            </a>

            <a
                href="riwayat.html"
                class="success-secondary">

                Riwayat Pesanan

            </a>

        </div>

    </div>

</main>

<footer>

    © 2026 Jidoor Konveksi

</footer>

<script>

const pesanan =
    JSON.parse(
        localStorage.getItem(
            "pesananTerakhir"
        )
    );

if (pesanan) {

    document.getElementById(
        "successOrderNumber"
    ).textContent =
        "#" + pesanan.id;

    const detailLink =
        document.querySelector(
            '.success-primary'
        );

    if (
        detailLink &&
        pesanan.id
    ) {
        detailLink.href =
            "detail-pesanan.html?id=" +
            encodeURIComponent(
                pesanan.id
            );
    }

}

</script>

</div>

<script src="assets/js/auth.js"></script>
<script src="assets/js/media-sync.js"></script>

</body>

</html>
