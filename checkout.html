<script>

let keranjang =
    JSON.parse(
        localStorage.getItem("keranjangCheckout") ||
        localStorage.getItem("keranjang")
    ) || [];

const checkoutList =
    document.getElementById(
        "checkoutList"
    );

const checkoutSubtotal =
    document.getElementById(
        "checkoutSubtotal"
    );

const checkoutOngkir =
    document.getElementById(
        "checkoutOngkir"
    );

const checkoutTotal =
    document.getElementById(
        "checkoutTotal"
    );

function formatRupiah(angka) {

    return "Rp " +
        Number(angka || 0)
            .toLocaleString("id-ID");

}

function parseHarga(value) {

    if (typeof value === "number") {
        return value;
    }

    return parseInt(
        String(value || "")
            .replace(/[^0-9]/g, ""),
        10
    ) || 0;

}

function hitungSubtotal() {

    return keranjang.reduce(
        function (total, item) {

            const harga =
                parseHarga(
                    item.harga ??
                    item.price
                );

            const jumlah =
                Number(
                    item.jumlah ??
                    item.quantity ??
                    1
                );

            return total + (harga * jumlah);

        },
        0
    );

}

function getCheckoutVariants(item) {

    if (Array.isArray(item.variants) && item.variants.length) {
        return item.variants;
    }

    return [{
        ukuran: item.ukuran || "-",
        lengan: item.lengan || "-",
        jumlah: Number(item.jumlah) || 1
    }];
}

function renderCheckoutVariants(item) {

    return getCheckoutVariants(item)
        .map(function (variant) {
            return `
                <span>
                    ${variant.ukuran || "-"}
                    · ${variant.lengan || "-"}
                    × ${Number(variant.jumlah) || 0}
                </span>
            `;
        })
        .join("");
}

function tampilkanCheckout() {

    if (!keranjang.length) {

        checkoutList.innerHTML = `
            <div class="empty-checkout">
                Keranjang Anda masih kosong.
            </div>
        `;

        checkoutSubtotal.textContent =
            "Rp 0";

        checkoutOngkir.textContent =
            "Rp 0";

        checkoutTotal.textContent =
            "Rp 0";

        return;

    }

    checkoutList.innerHTML =
        keranjang.map(
            function (item) {

                const jumlah =
                    Number(
                        item.jumlah ||
                        item.quantity ||
                        1
                    );

                const harga =
                    parseHarga(
                        item.harga ??
                        item.price
                    );

                const subtotal =
                    harga * jumlah;

                return `
                    <div class="checkout-item">

                        <div class="checkout-item-image">

                            <img
                                src="${jidoorProductImages.resolve(item)}"
                                alt="${item.nama || item.name || "Produk"}">

                        </div>

                        <div class="checkout-item-info">

                            <h3>
                                ${item.nama || item.name || "Produk"}
                            </h3>

                            <div class="order-variant-list">
                                ${renderCheckoutVariants(item)}
                            </div>

                            ${
                                item.isCustom
                                    ? `<p class="checkout-custom-design">
                                        <i class="bi bi-palette"></i>
                                        Desain custom · ${Number(item.desain?.elements?.length || 0)} elemen
                                      </p>`
                                    : ""
                            }

                            <p>
                                Total ${jumlah} pcs
                            </p>

                        </div>

                        <strong>
                            ${formatRupiah(subtotal)}
                        </strong>

                    </div>
                `;

            }
        ).join("");

    const subtotal =
        hitungSubtotal();

    const ongkir =
        subtotal > 0 ? 10000 : 0;

    const total =
        subtotal + ongkir;

    checkoutSubtotal.textContent =
        formatRupiah(subtotal);

    checkoutOngkir.textContent =
        ongkir === 0
            ? "Gratis"
            : formatRupiah(ongkir);

    checkoutTotal.textContent =
        formatRupiah(total);

}

async function lanjutPembayaran(event) {

    event.preventDefault();

    if (!keranjang.length) {

        alert(
            "Keranjang Anda masih kosong."
        );

        window.location.href =
            "keranjang.html";

        return;

    }

    const metode =
        document.querySelector(
            'input[name="metodePembayaran"]:checked'
        );

    if (!metode) {

        alert(
            "Silakan pilih metode pembayaran."
        );

        return;

    }

    let jenisEwallet = "";

    if (
        metode.value === "E-Wallet"
    ) {

        const ewallet =
            document.querySelector(
                'input[name="jenisEwallet"]:checked'
            );

        if (!ewallet) {

            alert(
                "Silakan pilih e-wallet terlebih dahulu."
            );

            return;

        }

        jenisEwallet =
            ewallet.value;

    }

    const subtotal =
        hitungSubtotal();

    const ongkir =
        subtotal > 0 ? 10000 : 0;

    const total =
        subtotal + ongkir;

    const orderId =
        "JD" +
        new Date()
            .toISOString()
            .slice(0, 10)
            .replace(/-/g, "") +
        "-" +
        Math.floor(
            1000 + Math.random() * 9000
        );

    const desainInput =
        document.getElementById(
            "desainPemesan"
        );

    let desainUpload = null;

    if (
        desainInput &&
        desainInput.files &&
        desainInput.files.length
    ) {
        const file = desainInput.files[0];

        if (file.size > 5 * 1024 * 1024) {
            alert("Ukuran desain maksimal 5 MB.");
            return;
        }

        try {
            desainUpload = await new Promise(function (resolve, reject) {
                const reader = new FileReader();

                reader.onload = function () {
                    resolve({
                        nama: file.name,
                        tipe: file.type,
                        ukuran: file.size,
                        data: reader.result
                    });
                };

                reader.onerror = function () {
                    reject(new Error("File desain tidak dapat dibaca."));
                };

                reader.readAsDataURL(file);
            });
        } catch (error) {
            alert(error.message || "Desain gagal diproses.");
            return;
        }
    }

    const checkoutData = {

        id: orderId,

        nama:
            document.getElementById(
                "namaPemesan"
            ).value.trim(),

        alamat:
            document.getElementById(
                "alamatPemesan"
            ).value.trim(),

        noHp:
            document.getElementById(
                "noHpPemesan"
            ).value.trim(),

        desain:
            desainUpload,

        produk:
            keranjang.map(function (item) {
                return desainUpload
                    ? {
                        ...item,
                        checkoutDesign: desainUpload
                    }
                    : item;
            }),

        subtotal:
            subtotal,

        ongkir:
            ongkir,

        total:
            total,

        metodePembayaran:
            metode.value,

        jenisEwallet:
            jenisEwallet,

        statusPembayaran:
            "Menunggu Pembayaran",

        statusPesanan:
            "Menunggu Pembayaran",

        tanggal:
            new Date().toISOString()

    };

    localStorage.setItem(
        "checkoutData",
        JSON.stringify(checkoutData)
    );

    localStorage.removeItem("keranjangCheckout");

    window.location.href =
        "pembayaran.html";

}

const paymentEwallet =
    document.getElementById(
        "paymentEwallet"
    );

const ewalletOptions =
    document.getElementById(
        "ewalletOptions"
    );

const ewalletNumber =
    document.getElementById(
        "ewalletNumber"
    );

const ewalletName =
    document.getElementById(
        "ewalletName"
    );

const ewalletPhone =
    document.getElementById(
        "ewalletPhone"
    );

const copyEwallet =
    document.getElementById(
        "copyEwallet"
    );

if (paymentEwallet) {

    paymentEwallet.addEventListener(
        "change",
        function () {

            if (this.checked) {

                ewalletOptions.style.display =
                    "block";

            }

        }
    );

}

const paymentBank =
    document.getElementById(
        "paymentBank"
    );

const paymentCod =
    document.getElementById(
        "paymentCod"
    );

[paymentBank, paymentCod].forEach(
    function (radio) {

        if (!radio) {
            return;
        }

        radio.addEventListener(
            "change",
            function () {

                if (
                    ewalletOptions
                ) {

                    ewalletOptions.style.display =
                        "none";

                }

                if (
                    ewalletNumber
                ) {

                    ewalletNumber.style.display =
                        "none";

                }

            }
        );

    }
);

const ewalletChoices =
    document.querySelectorAll(
        'input[name="jenisEwallet"]'
    );

ewalletChoices.forEach(
    function (radio) {

        radio.addEventListener(
            "change",
            function () {

                const data = {

                    DANA:
                        "0812 3456 7890",

                    GoPay:
                        "0813 4567 8901",

                    OVO:
                        "0812 9876 5432"

                };

                if (ewalletName) ewalletName.textContent = "";

                ewalletPhone.textContent =
                    data[this.value];

                ewalletNumber.style.display =
                    "flex";

            }
        );

    }
);

if (copyEwallet) {

    copyEwallet.addEventListener(
        "click",
        function () {

            navigator.clipboard.writeText(
                ewalletPhone.textContent
            );

            this.innerHTML =
                '<i class="bi bi-check"></i> Tersalin';

            setTimeout(
                () => {

                    this.innerHTML =
                        '<i class="bi bi-copy"></i> Salin';

                },
                1500
            );

        }
    );

}

tampilkanCheckout();

</script>
