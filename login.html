<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | Jidoor Konveksi</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/auth.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/uniform.css">
<link rel="stylesheet" href="assets/css/mobile-responsive.css">
</head>

<body>

<section class="login-page">

    <div class="login-container">

<div class="login-left">

    <div class="login-overlay">

        <img
            src="assets/img/JIDOOR LOGO.png"
            alt="Jidoor Konveksi"
            class="login-logo">

        <div class="login-copy">

            <h1>
                Solusi Apparel<br>
                Custom Berkualitas
            </h1>

            <p>
                Pesan kaos, jersey, hoodie, polo,
                dan berbagai apparel custom dengan
                mudah melalui Jidoor Konveksi.
            </p>

            <div class="login-products">

                <span>Kaos</span>
                <span>Hoodie</span>
                <span>Jersey</span>
                <span>Polo</span>
                <span>Rompi</span>

            </div>

        </div>

    </div>

</div>

        <div class="login-right">

            <div class="login-content">

                <div class="login-heading">

                    <h2>
                        Selamat Datang
                    </h2>

                    <p>
                        Masuk ke akun Anda untuk
                        melanjutkan pemesanan.
                    </p>

                </div>

                <form
                    id="loginForm"
                    onsubmit="prosesLogin(event)">

                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-box">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Masukkan email Anda"
                                autocomplete="email"
                                required>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box password-box">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan password Anda"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Tampilkan password">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>

                    <div class="login-option">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember">

                            <span>
                                Ingat Saya
                            </span>

                        </label>

                        <a href="forgot-password.html">
                            Lupa Password?
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="btn-auth"
                        id="btnLogin">

                        <span id="btnText">
                            Masuk
                        </span>

                        <span
                            id="loadingSpinner"
                            style="display:none;">

                            <i class="bi bi-arrow-repeat"></i>

                        </span>

                    </button>

                    <div class="divider">

                        <span>ATAU</span>

                    </div>

                    <button
                        type="button"
                        class="btn-google">

                        <i class="bi bi-google"></i>

                        <span>
                            Masuk dengan Google
                        </span>

                    </button>

                    <p class="register-text">

                        Belum punya akun?

                        <a href="register.html">
                            Daftar Sekarang
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</section>

<script src="assets/js/auth.js"></script>

<script>

function prosesLogin(e){

    e.preventDefault();

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    login(email,password);

}

</script>

</body>

</html>
