<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lupa Kata Sandi | Jidoor Konveksi</title>
    <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="assets/css/auth-forgot.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/uniform.css">
<link rel="stylesheet" href="assets/css/mobile-responsive.css">
</head>
<body class="auth-page">
    <main class="auth-shell compact-shell">
        <section class="brand-panel">
            <a class="brand" href="index.html">
    <img
        src="assets/img/logo.png"
        alt="Jidoor Konveksi"
        class="brand-logo">
</a>
            <div class="brand-copy">
                <p class="eyebrow">BANTUAN AKUN</p>
                <h1>Jangan khawatir, kami bantu Anda kembali.</h1>
                <p>Masukkan email Anda untuk memperoleh petunjuk pemulihan kata sandi.</p>
            </div>
        </section>
        <section class="form-panel">
            <div class="form-wrap">
                <a class="mobile-brand" href="index.html">
                    <img
                        src="assets/img/logo.png"
                        alt="Jidoor Konveksi"
                        class="brand-logo">
                </a>
                <p class="eyebrow">PULIHKAN AKUN</p>
                <h2>Lupa kata sandi?</h2>
                <p class="form-intro">Kami akan mengirimkan tautan pengaturan ulang ke email Anda.</p>
                <form id="forgotForm" novalidate>
                    <label for="forgotEmail">Alamat email</label>
                    <input id="forgotEmail" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
                    <p class="field-error" data-error="email"></p>
                    <button class="primary-button" type="submit">Kirim Tautan <span>→</span></button>
                </form>
                <p class="auth-switch">
                    <a href="login.html">← Kembali ke halaman masuk</a>
                </p>
            </div>
        </section>
    </main>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <script src="assets/js/auth.js"></script>
<script src="assets/js/media-sync.js"></script>
</body>
</html>
